[project]
name = "crux"
version = "0.1.0"
description = "Crux: Enterprise Ontology (Utopia) plus Token Optimization (Headroom)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crux*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
